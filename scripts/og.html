<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Onest";
    src: url("../public/fonts/onest-cyrillic.woff2") format("woff2");
    font-weight: 400 800;
    font-display: block;
  }
  @font-face {
    font-family: "Unbounded";
    src: url("../public/fonts/unbounded-cyrillic.woff2") format("woff2");
    font-weight: 400 800;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Onest", sans-serif;
    background: #fbf5ea;
    color: #251e17;
    display: grid;
    grid-template-columns: 1fr 470px;
  }
  .copy {
    padding: 62px 54px 54px 70px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    padding: 9px 16px;
    border-radius: 999px;
    background: #f1e4ce;
    color: #7c5a35;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #e2542c; }
  h1 {
    font-family: "Unbounded", sans-serif;
    font-weight: 700;
    font-size: 82px;
    line-height: 0.98;
    letter-spacing: -0.055em;
    margin-top: 30px;
  }
  h1 span { color: #e2542c; }
  .tagline {
    margin-top: 20px;
    font-size: 31px;
    font-weight: 600;
    color: #4d4237;
  }
  .chips { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
  .chip {
    padding: 8px 15px;
    border: 1px solid rgba(37, 30, 23, 0.16);
    border-radius: 999px;
    font-size: 18px;
    font-weight: 600;
    color: #4d4237;
  }
  .foot {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 17px;
    color: #7c6f61;
    padding-top: 24px;
    border-top: 1px solid rgba(37, 30, 23, 0.12);
  }
  .foot svg { width: 26px; height: 26px; flex: none; }
  .art {
    background: #e2542c;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .art::before {
    content: "";
    position: absolute;
    width: 340px; height: 340px;
    border-radius: 50%;
    background: #f6b94a;
    opacity: 0.9;
    top: -90px; right: -90px;
  }
  .art::after {
    content: "";
    position: absolute;
    width: 240px; height: 240px;
    border-radius: 50%;
    border: 34px solid rgba(251, 245, 234, 0.22);
    bottom: -90px; left: -80px;
  }
  .art svg { width: 360px; height: 360px; position: relative; z-index: 2; filter: drop-shadow(0 30px 40px rgba(37, 30, 23, 0.26)); }
  .price {
    position: absolute;
    z-index: 3;
    bottom: 44px;
    right: 40px;
    background: #fbf5ea;
    color: #251e17;
    border-radius: 18px;
    padding: 12px 18px;
    font-size: 19px;
    font-weight: 700;
    transform: rotate(-4deg);
    box-shadow: 0 14px 24px rgba(37, 30, 23, 0.18);
  }
  .price small { display: block; font-size: 12px; font-weight: 600; color: #7c6f61; letter-spacing: 0.06em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="copy">
    <span class="eyebrow"><span class="dot"></span>Демо-кафе быстрого питания</span>
    <h1>Тёплый<br /><span>бокс</span></h1>
    <p class="tagline">Горячо. Быстро. По-соседски.</p>
    <div class="chips">
      <span class="chip">Бургеры</span>
      <span class="chip">Шаурма</span>
      <span class="chip">Пицца</span>
      <span class="chip">Напитки</span>
    </div>
    <div class="foot">
      <svg viewBox="0 0 24 24" fill="none" stroke="#e2542c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 2-1.6L21.5 7H6" />
        <circle cx="10" cy="20" r="1.3" /><circle cx="18" cy="20" r="1.3" />
      </svg>
      Приватная ссылка на заказ · 3D-витрина · бонус после получения
    </div>
  </div>
  <div class="art">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <path d="M196 166c0-26 27-46 60-46s60 20 60 46" fill="none" stroke="#8e2f1b" stroke-width="14" stroke-linecap="round"/>
      <rect x="132" y="150" width="248" height="72" rx="26" fill="#f8eddc"/>
      <path d="M148 206h216l-18 148a34 34 0 0 1-34 30H200a34 34 0 0 1-34-30l-18-148Z" fill="#f8eddc"/>
      <path d="M158 236h196l-6 46H164l-6-46Z" fill="#f6b94a"/>
      <ellipse cx="210" cy="326" rx="14" ry="17" fill="#251e17"/>
      <ellipse cx="302" cy="326" rx="14" ry="17" fill="#251e17"/>
      <circle cx="184" cy="300" r="13" fill="#f4a79a"/>
      <circle cx="328" cy="300" r="13" fill="#f4a79a"/>
      <path d="M232 352c14 12 34 12 48 0" fill="none" stroke="#251e17" stroke-width="12" stroke-linecap="round"/>
    </svg>
    <div class="price"><small>минимум</small>500 ₽</div>
  </div>
</body>
</html>
